plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = project.mod_version + '+' + project.minecraft_version
group = 'teamroots.goetia'
base { archivesName = 'goetia-neoforge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
neoForge {
 version = project.neo_version
 runs {
  client { client() }
  server { server(); programArgument '--nogui' }
  if (project.hasProperty('portTests')) { gameTestServer { type = 'gameTestServer'; gameDirectory = project.file('run-porttest'); systemProperty 'neoforge.enabledGameTestNamespaces', 'goetia' } }
  configureEach { logLevel = org.slf4j.event.Level.INFO }
 }
 mods { goetia { sourceSet(sourceSets.main) } }
}
if (project.hasProperty('portTests')) { sourceSets.main.java.srcDir 'src/porttest/java'; sourceSets.main.resources.srcDir 'src/porttest/resources' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs','1000'] }
tasks.named('jar') { exclude 'teamroots/goetia/porttest/**'; exclude 'data/goetia/structure/port_empty9.nbt' }
tasks.named('sourcesJar') { exclude 'teamroots/goetia/porttest/**'; exclude 'data/goetia/structure/port_empty9.nbt' }

repositories { maven { url='https://maven.blamejared.com/'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } } }
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
 compileOnly 'mezz.jei:jei-26.1.2-common-api:29.47.0.111'
 compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.47.0.111'
 if(project.hasProperty('withJei'))localRuntime 'mezz.jei:jei-26.1.2-neoforge:29.47.0.111'
}

tasks.named('jar') {
 from('../LICENSE') { into 'META-INF/licenses/goetia' }
 from('../licenses/Goetia-MIT.txt') { into 'META-INF/licenses/goetia' }
 from('../CREDITS.md') { into 'META-INF/licenses/goetia' }
}
tasks.named('sourcesJar') {
 from('../LICENSE') { into 'META-INF/licenses/goetia' }
 from('../licenses/Goetia-MIT.txt') { into 'META-INF/licenses/goetia' }
 from('../CREDITS.md') { into 'META-INF/licenses/goetia' }
}

if (project.hasProperty('hiddenTest')) {
 sourceSets.main.java.srcDir 'src/hiddentest/java'
 sourceSets.main.resources.srcDir 'src/hiddentest/resources'
 neoForge.runs.client {
  gameDirectory = project.file('run-hidden-porttest')
  jvmArgument '-Xmx3G'
  systemProperty 'goetia.autotest', 'true'
 }
}
tasks.named('processResources') {
 inputs.property 'hiddenTest',project.hasProperty('hiddenTest')
 doLast { if(project.hasProperty('hiddenTest')) { file("$destinationDir/META-INF/neoforge.mods.toml").append('\n[[mixins]]\nconfig="goetia.hiddentest.mixins.json"\n') } }
}
tasks.named('jar') {
 exclude 'teamroots/goetia/hiddentest/**'; exclude 'goetia.hiddentest.mixins.json'
 doFirst { if(project.hasProperty('hiddenTest'))throw new GradleException('Hidden test profile cannot package artifacts') }
}
tasks.named('sourcesJar') { exclude 'teamroots/goetia/hiddentest/**'; exclude 'goetia.hiddentest.mixins.json' }
